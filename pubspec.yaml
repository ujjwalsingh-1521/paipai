name: expense_tracker
description: "A local-first expense tracker app."
publish_to: 'none'
version: 1.8.0+13

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2
  fl_chart: ^0.69.0
  crypto: ^3.0.3
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true

  # Roboto Flex (SIL OFL, assets/fonts/OFL.txt), cut into static weights so
  # FontWeight works without variable-font axes. "Display" is the optical
  # size for large numbers. Regenerate: see branding/README.md.
  fonts:
    - family: RobotoFlex
      fonts:
        - asset: assets/fonts/RobotoFlex-Regular.ttf
        - asset: assets/fonts/RobotoFlex-Medium.ttf
          weight: 500
        - asset: assets/fonts/RobotoFlex-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/RobotoFlex-Bold.ttf
          weight: 700
    - family: RobotoFlexDisplay
      fonts:
        - asset: assets/fonts/RobotoFlexDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/RobotoFlexDisplay-Bold.ttf
          weight: 700
